name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          # Run project styling check
          flake8 . --count --exit-zero --max-complexity=10 --ignore=E501,W503 --exclude=.venv --statistics

      - name: Verify Python Compilation
        run: |
          python -m compileall -q actions agents tools utils tests run_agents.py run_servers.py

      - name: Run Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify CLI Scenario Discovery
        run: |
          python run_agents.py --list
